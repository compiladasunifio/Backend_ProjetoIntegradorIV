# Nome do aplicativo
spring.application.name=unifood

# Caminho da conexão
spring.datasource.url=jdbc:mysql://localhost:3306/unifood?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo

# Usuário
spring.datasource.username=unifood

# Senha
spring.datasource.password=123@Mudar

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ativa a criação das tabelas (recria o banco a cada execução e carrega o import.sql)
spring.jpa.hibernate.ddl-auto=create

# Exibe as SQLs
spring.jpa.show-sql=true

# Formata as SQLs
spring.jpa.properties.hibernate.format_sql=true

# Especifica o dialeto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Lê o import.sql como UTF-8 (acentos nos dados de exemplo)
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# A validação dos dados é feita nos recursos (@Valid) e nos serviços.
# Desliga a validação automática do Hibernate ao gravar, para não validar de novo
# (ex.: uma encomenda antiga com data de retirada no passado ainda pode mudar de status).
spring.jpa.properties.jakarta.persistence.validation.mode=none
